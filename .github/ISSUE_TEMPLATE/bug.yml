name: Bug report
description: Report reproducible incorrect behaviour
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, personal data, or live operational telemetry.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed behaviour
    validations:
      required: true
